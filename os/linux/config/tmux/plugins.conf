# vim: ft=tmux

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'caiogondim/maglev'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
# set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'Morantron/tmux-fingers'
set -g @plugin 'smart-splits-nvim/backend-tmux'
set -g @plugin 'tmux-plugins/tmux-net-speed'
set -g @plugin 'alexwforsythe/tmux-which-key' #trigger prefix + space

# status icon
set -g @plugin 'MunifTanjim/tmux-mode-indicator'
set -g @mode_indicator_empty_prompt ' ◇ '
set -g @mode_indicator_empty_mode_style 'bg=term,fg=color2'
set -g @mode_indicator_prefix_prompt ' ◈ '
set -g @mode_indicator_prefix_mode_style 'bg=color2,fg=color0'
set -g @mode_indicator_copy_prompt '  '
set -g @mode_indicator_copy_mode_style 'bg=color10,fg=color0'
set -g @mode_indicator_sync_prompt '   '
set -g @mode_indicator_sync_mode_style 'bg=color6,fg=color0'


# what to do when the pane is against the edge of its tmux window. Mirrors
# smart-splits.nvim's `move.at_edge`, and should be kept in step with it:
#   wrap  => focus the pane on the far side (the default, and tmux's own behaviour)
#   stop  => do nothing
#   split => create a pane, inheriting the current pane's directory
set -g @smart-splits_at_edge 'wrap'

set -g @smart-splits_move_left_key  'C-h'
set -g @smart-splits_move_down_key  'C-j'
set -g @smart-splits_move_up_key    'C-k'
set -g @smart-splits_move_right_key 'C-l'

set -g @smart-splits_resize_left_key  'C-left'
set -g @smart-splits_resize_down_key  'C-down'
set -g @smart-splits_resize_up_key    'C-up'
set -g @smart-splits_resize_right_key 'C-right'

set -g @smart-splits_resize_step_size '3'



set -g @fingers-main-action ':open:'
set -g @fingers-alt-action ':copy:'
bind e run -b "#{@fingers-cli} start #{pane_id} --patterns url"
set -g @fingers-show-copied-notification true


# navigate and resize nvim/tmux splits
