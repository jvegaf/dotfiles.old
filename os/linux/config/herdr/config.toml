onboarding = false
# herdr configuration
# Place this file at ~/.config/herdr/config.toml

# Show first-run notification setup on startup.
# Missing also shows onboarding; set false after you've chosen.
# onboarding = true

[theme]
# Built-in themes: catppuccin, terminal, tokyo-night, dracula, nord,
#                  gruvbox, one-dark, solarized, kanagawa, rose-pine,
#                  vesper
# name = "catppuccin"

# Follow host terminal light/dark appearance and switch Herdr UI themes.
# Existing manual behavior is unchanged unless this is true.
# auto_switch = false
# dark_name = "catppuccin"
# light_name = "catppuccin-latte"

# Override individual color tokens on top of the base theme.
# Accepts: hex (#rrggbb), named colors, rgb(r,g,b), or panel_bg = "reset"
# [theme.custom]
# sidebar_bg = "#181825"
# active_row_bg = "#1e1e2e"
# selection_bg = "#313244"
# panel_bg = "reset"
# accent = "#f5c2e7"
# red = "#ff6188"
# green = "#a6e3a1"

name = "kanagawa"
auto_switch = false
[terminal]
# Executable used for new interactive panes.
# Empty means $SHELL, then /bin/sh.
# default_shell = ""

# Startup mode for new interactive pane shells: "auto", "login", or "non_login".
# "auto" uses login shells on macOS and keeps the current behavior elsewhere.
# shell_mode = "auto"

# CWD policy for new panes, tabs, and workspaces when no explicit --cwd is provided.
# Use "follow" to inherit the source pane/workspace, "home" for $HOME,
# "current" for Herdr's process directory, or a fixed path such as "~/Projects".
# new_cwd = "follow"

[update]
# Update channel used by background version checks and `herdr update`.
# Stable builds default to "stable". Windows preview builds default to "preview"
# so existing preview installs stay there until explicitly switched.
# channel = "stable"

# Check herdr.dev for new Herdr versions in the background.
# version_check = true

# Check herdr.dev for remote agent-detection manifest updates in the background.
# manifest_check = true

[keys]
# Prefix key to enter prefix mode (default: "ctrl+b")
# Examples: "ctrl+b", "f12", "esc", "-"
# Action bindings use explicit syntax: "prefix+n" requires the prefix;
# "ctrl+alt+n" is a direct terminal-mode shortcut.
# Accepted key syntax: plain keys, ctrl/shift/alt/cmd/super modifiers, and special keys like enter/tab/esc/left/right/up/down.
# Named punctuation such as minus, comma, ampersand, plus, and backtick is also accepted.
# Most reliable direct bindings are ctrl+letter, function keys, and explicit modified chords.
# alt+..., cmd/super, and punctuation-with-modifiers may depend on your terminal/tmux setup.
prefix = "ctrl+a"

# Prefix-mode actions
# help = "prefix+?"
# settings = "prefix+s"
# detach = "prefix+q"
# reload_config = "prefix+shift+r"
# open_notification_target = "prefix+o"
# workspace_picker = "prefix+w"
# goto = "prefix+g"
# new_workspace = "prefix+shift+n"
# new_worktree = "prefix+shift+g"
# open_worktree = ""    # optional, unset by default
# remove_worktree = ""  # optional, unset by default; opens confirmation
# rename_workspace = "prefix+shift+w"
# close_workspace = "prefix+shift+d"
# previous_workspace = "" # optional, unset by default
# next_workspace = ""     # optional, unset by default
# previous_agent = ""     # optional, unset by default
# next_agent = ""         # optional, unset by default
focus_agent = "prefix+1..9" # optional indexed binding, e.g. "prefix+alt+1..9"
# remote_image_paste = "ctrl+v" # only active in herdr --remote; empty disables raw-key image paste
new_tab = "prefix+c"
# rename_tab = "prefix+shift+t"
# previous_tab = "prefix+p"
next_tab = "prefix+n"
# move_tab_previous = ""   # optional, e.g. "alt+shift+left" moves the tab toward the front
# move_tab_next = ""       # optional, e.g. "alt+shift+right" moves the tab toward the back
# switch_tab = "prefix+1..9"
# switch_workspace = ""   # optional indexed binding, e.g. "prefix+shift+1..9"
# close_tab = "prefix+shift+x"
# rename_pane = "prefix+shift+p"
# edit_scrollback = "prefix+e"
# Disable herdr's default pane navigation so Ctrl+hjkl pass through to tmux/neovim
# where smart-splits handles seamless navigation across neovim/tmux/herdr boundaries
focus_pane_left = "Ctrl+h"
focus_pane_down = "Ctrl+j"
focus_pane_up = "Ctrl+k"
focus_pane_right = "Ctrl+l"
# cycle_pane_next = "prefix+tab"
# cycle_pane_previous = "prefix+shift+tab"
# last_pane = ""          # optional, unset by default; bind e.g. "prefix+tab" for global back-and-forth
split_vertical = "prefix+."
split_horizontal = "prefix+minus"
# close_pane = "prefix+x"
# zoom = "prefix+z"       # legacy alias: fullscreen
# resize_mode = "prefix+r"
resize_pane_left = "Ctrl+left"   # optional, e.g. "ctrl+shift+alt+left" resizes without entering resize mode
resize_pane_down = "Ctrl+down"   # optional, e.g. "ctrl+shift+alt+down"
resize_pane_up = "Ctrl+up"       # optional, e.g. "ctrl+shift+alt+up"
resize_pane_right = "Ctrl+right" # optional, e.g. "ctrl+shift+alt+right"
# toggle_sidebar = "prefix+b"

# Navigate-mode movement. These local shortcuts win while navigate mode is open.
# They are independent from focus_pane_*. Do not include prefix+, esc, enter, tab, or 1..9 here.
# navigate_workspace_up = "up"
# navigate_workspace_down = "down"
# Disable navigate-mode pane keys (h/j/k/l) to avoid any conflict
navigate_pane_left = ""
navigate_pane_down = ""
navigate_pane_up = ""
navigate_pane_right = ""

# El navegador nativo se queda donde estaba.
goto = "ctrl+p"

# Worktrees: varias ramas del mismo repo abiertas a la vez, cada una como su
# propio espacio en el sidebar. new_worktree ya venia por defecto; open y
# remove venian sin asignar, asi que se activan aqui.
new_worktree = "prefix+shift+g"  # crear rama nueva y abrirla como espacio
open_worktree = "prefix+alt+g"   # abrir un worktree que ya existe
remove_worktree = "prefix+alt+d" # quitar el checkout (pide confirmacion)

[[keys.command]]
key = "prefix+alt+p"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "open plugin manager"



# nvim en la carpeta del pane enfocado o, si es un pane de Claude, en la del
# proyecto que esta editando (ver el script). "pane" abre un pane temporal que
# se cierra al salir de nvim.
[[keys.command]]
key = "prefix+shift+e"
type = "pane"
description = "nvim en el proyecto"
command = 'node "$XDG_CONFIG_DIR/herdr/scripts/nvim-here.mjs"'

[[keys.command]]              # lazygit: open in a split
key = "prefix+g"
type = "plugin_action"
command = "herdr-lazygit.open"

[[keys.command]]              # lazygit: open in its own tab
key = "prefix+shift+l"
type = "plugin_action"
command = "herdr-lazygit.open-tab"

 # [[keys.command]]
# key = "prefix+space"
# type = "popup"                 # the only route with a real interactive TTY
# command = "sh ~/.config/herdr/plugins/config/cowboyvang.which-key/launch.sh"
# description = "which-key: show prefix bindings"
# width = "78%"
# height = "62%"
[[keys.command]]
key = "prefix+space"            # or "ctrl+space" for a direct, prefix-free leader
type = "plugin_action"
command = "pradyb.which-key.open"
description = "which-key"


[worktrees]
# Donde se crean los checkouts de las ramas. Por defecto ~/.herdr/worktrees;
# se deja explicito para saber donde buscarlos.
directory = "~/.herdr/worktrees"

[ui]
copy_on_select = true

show_agent_labels_on_pane_borders = true
# Background notification popup delivery
status_indicators = "symbols"
[ui.toast]
# off = disable pop-up notifications
# herdr = show in-app toasts
# terminal = ask the outer terminal to show a desktop notification
# system = ask the OS notification service directly
delivery = "herdr"
# delay_seconds = 1


# Play sounds when agents change state in background workspaces
[ui.sound]
enabled = true

[experimental]
pane_history = false
